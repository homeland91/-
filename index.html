<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فصيل شرطة هوميلاند</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --gold-primary: #d4af37;
            --gold-hover: #f3e5ab;
            --text-color: #e0e0e0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* شريط التنبيه للمسؤول */
        .admin-banner {
            display: none;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
        }

        /* الهيدر والعنوان */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--gold-primary);
            font-size: 2.5rem;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            margin-bottom: 15px;
        }

        .faction-img {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 12px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
            object-fit: cover;
        }

        /* الأزرار العامة */
        .btn {
            background: linear-gradient(135deg, var(--gold-primary), #aa820a);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--gold-hover), var(--gold-primary));
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        .btn-back {
            background: #222;
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            margin-bottom: 20px;
        }

        .btn-back:hover {
            background: var(--gold-primary);
            color: #000;
        }

        /* بطاقات الواجهة الرئيسية */
        .main-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--gold-primary);
            padding: 30px 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
        }

        .menu-card h2 {
            color: var(--gold-primary);
            font-size: 1.5rem;
        }

        /* الأقسام الداخلية */
        .section-view {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .section-view.active {
            display: block;
        }

        /* شريط الأزرار المخفي للزوار */
        .action-bar {
            display: none;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* عناصر المايكرو والسياسات */
        .item-box {
            background: #111;
            border: 1px solid var(--border-color);
            border-right: 4px solid var(--gold-primary);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .item-title {
            font-weight: bold;
            color: var(--gold-primary);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .item-content {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            resize: vertical;
            font-size: 0.95rem;
        }

        /* القوائم المطوية (Accordion) */
        .accordion {
            background-color: #111;
            color: var(--gold-primary);
            cursor: pointer;
            padding: 15px;
            width: 100%;
            border: 1px solid var(--border-color);
            text-align: right;
            outline: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: 0.3s;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion:hover, .active-acc {
            background-color: #222;
            border-color: var(--gold-primary);
        }

        .panel {
            padding: 0 15px;
            background-color: #181818;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            border-radius: 0 0 6px 6px;
        }

        .panel-content {
            padding: 15px 0;
            color: #ccc;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شريط التنبيه عند تفعيل وضع التعديل -->
        <div id="admin-banner" class="admin-banner">
            ⚙️ تم تفعيل وضع التعديل والتحكم (المسؤول)
        </div>

        <!-- الواجهة الرئيسية -->
        <div id="main-view">
            <header>
                <h1>فصيل شرطة هوميلاند</h1>
                <img src="https://via.placeholder.com/600x300/181818/d4af37?text=Homeland+Police+Faction" alt="شعار فصيل شرطة هوميلاند" class="faction-img">
            </header>

            <div class="main-menu">
                <div class="menu-card" onclick="openSection('macro-view')">
                    <h2>مايكرو الفصيل</h2>
                    <p style="color: #aaa; margin-top: 10px;">إدارة وحفظ الأوامر والنصوص السريعة للنسخ</p>
                </div>
                <div class="menu-card" onclick="openSection('policies-view')">
                    <h2>سياسات ونظام الترقية</h2>
                    <p style="color: #aaa; margin-top: 10px;">استعراض القوانين وشروط الترقيات الرتبية</p>
                </div>
            </div>
        </div>

        <!-- قسم مايكرو الفصيل -->
        <div id="macro-view" class="section-view">
            <button class="btn btn-back" onclick="goHome()">➜ الرجوع للرئيسية</button>
            <h2 style="color: var(--gold-primary); margin-bottom: 15px;">قسم مايكرو الفصيل</h2>
            
            <div class="action-bar admin-only">
                <button class="btn" onclick="addMacroBox()">+ إضافة مايكرو جديد</button>
            </div>

            <div id="macro-container">
                <!-- مايكرو افتراضي -->
                <div class="item-box">
                    <input type="text" class="item-title editable-field" value="نداء التوقف الأول" readonly style="background:transparent; border:none;">
                    <textarea rows="3" class="item-content editable-field" id="macro-1" readonly>مركبة هوميلاند: يرجى من سائق المركبة التوقف جانباً وإطفاء المحرك فوراً للتفتيش الروتيني.</textarea>
                    <button class="btn" style="margin-top: 10px; font-size: 0.85rem;" onclick="copyText('macro-1')">📋 نسخ النص</button>
                </div>
            </div>
        </div>

        <!-- قسم السياسات ونظام الترقية -->
        <div id="policies-view" class="section-view">
            <button class="btn btn-back" onclick="goHome()">➜ الرجوع للرئيسية</button>
            <h2 style="color: var(--gold-primary); margin-bottom: 15px;">سياسات ونظام الترقية</h2>
            
            <div class="action-bar admin-only">
                <button class="btn" onclick="addPolicyBox()">+ إضافة بند جديد</button>
                <button class="btn" onclick="addAccordionBox()">+ إضافة قائمة مطوية</button>
            </div>

            <div id="policies-container">
                <!-- عنصر مطوي افتراضي -->
                <button class="accordion" onclick="toggleAccordion(this)">
                    <span>نظام الترقية من رتبة جندي إلى عريف</span>
                    <span>▼</span>
                </button>
                <div class="panel">
                    <div class="panel-content">
                        <textarea class="item-content editable-field" rows="4" readonly style="background:transparent; border:none;">الشروط المطلوبة:
1. الخدمة لمدة 3 أيام متواصلة.
2. حضور الدوريات والالتزام بالمايكرو الرسمية.
3. عدم وجود أي مخالفات مسجلة.</textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SECRET_PIN = "1221";
        let isAdmin = false;

        // التحقق من وجود الرمز في رابط الموقع
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const pin = urlParams.get('pin');

            if (pin === SECRET_PIN) {
                isAdmin = true;
                enableAdminMode();
            }
        };

        // تفعيل وضع المسؤول
        function enableAdminMode() {
            document.getElementById('admin-banner').style.display = 'block';
            
            // إظهار أزرار الإضافة
            document.querySelectorAll('.admin-only').forEach(el => {
                el.style.display = 'flex';
            });

            // جعل الخانات قابلة للتعديل
            document.querySelectorAll('.editable-field').forEach(field => {
                field.removeAttribute('readonly');
                if(field.tagName === 'INPUT') field.style.border = "1px solid #333";
            });
        }

        // التنقل بين الأقسام
        function openSection(sectionId) {
            document.getElementById('main-view').style.display = 'none';
            document.querySelectorAll('.section-view').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        function goHome() {
            document.querySelectorAll('.section-view').forEach(sec => sec.classList.remove('active'));
            document.getElementById('main-view').style.display = 'block';
        }

        // نسخ النص
        function copyText(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(textarea.value);
            alert("تم نسخ النص بنجاح!");
        }

        // إضافة مايكرو جديد (للمسؤول)
        let macroCounter = 2;
        function addMacroBox() {
            const container = document.getElementById('macro-container');
            const newId = `macro-${macroCounter++}`;
            const box = document.createElement('div');
            box.className = 'item-box';
            box.innerHTML = `
                <input type="text" class="item-title" placeholder="عنوان المايكرو..." style="border:1px solid #333; background:#1a1a1a; padding:5px; border-radius:4px; width:100%;">
                <textarea rows="3" class="item-content" id="${newId}" placeholder="اكتب نص المايكرو هنا..."></textarea>
                <button class="btn" style="margin-top: 10px; font-size: 0.85rem;" onclick="copyText('${newId}')">📋 نسخ النص</button>
            `;
            container.appendChild(box);
        }

        // إضافة خانة سياسة جديدة (للمسؤول)
        function addPolicyBox() {
            const container = document.getElementById('policies-container');
            const box = document.createElement('div');
            box.className = 'item-box';
            box.innerHTML = `
                <input type="text" class="item-title" placeholder="عنوان السياسة..." style="border:1px solid #333; background:#1a1a1a; padding:5px; border-radius:4px; width:100%;">
                <textarea rows="3" class="item-content" placeholder="تفاصيل السياسة..."></textarea>
            `;
            container.appendChild(box);
        }

        // إضافة قائمة مطوية جديدة (للمسؤول)
        function addAccordionBox() {
            const container = document.getElementById('policies-container');
            const accBtn = document.createElement('button');
            accBtn.className = 'accordion';
            accBtn.onclick = function() { toggleAccordion(this); };
            accBtn.innerHTML = `
                <span contenteditable="true" style="border-bottom: 1px dashed var(--gold-primary);">عنوان القائمة المطوية (اضغط للتعديل)</span>
                <span>▼</span>
            `;
            
            const panel = document.createElement('div');
            panel.className = 'panel';
            panel.innerHTML = `
                <div class="panel-content">
                    <textarea rows="3" class="item-content" placeholder="اكتب المحتوى هنا..."></textarea>
                </div>
            `;
            
            container.appendChild(accBtn);
            container.appendChild(panel);
        }

        // فتح وإغلاق القوائم المطوية
        function toggleAccordion(element) {
            element.classList.toggle("active-acc");
            const panel = element.nextElementSibling;
            if (panel.style.maxHeight) {
                panel.style.maxHeight = null;
            } else {
                panel.style.maxHeight = panel.scrollHeight + "px";
            }
        }
    </script>
</body>
</html>
