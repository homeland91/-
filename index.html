<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فصيل شرطة هوميلاند</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --gold-primary: #d4af37;
            --gold-hover: #f3e5ab;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --red-alert: #ff2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            padding-bottom: 90px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* شريط التنبيه للمسؤول */
        .admin-banner {
            display: none;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--gold-primary);
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            margin-bottom: 15px;
        }

        .faction-img {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 12px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
            object-fit: cover;
        }

        /* الأزرار العامة */
        .btn {
            background: linear-gradient(135deg, var(--gold-primary), #aa820a);
            color: #000;
            border: none;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--gold-hover), var(--gold-primary));
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .btn-save {
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: #fff;
        }

        .btn-delete {
            background: rgba(255, 42, 42, 0.2);
            color: var(--red-alert);
            border: 1px solid var(--red-alert);
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            display: none;
        }

        .btn-delete:hover {
            background: var(--red-alert);
            color: #fff;
        }

        .btn-back {
            background: #222;
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            margin-bottom: 20px;
        }

        .btn-sub {
            font-size: 0.8rem;
            padding: 5px 10px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
        }

        .btn-sub-warning {
            background: rgba(255, 42, 42, 0.2);
            color: #ff6b6b;
            border: 1px solid var(--red-alert);
        }

        /* القائمة الرئيسية */
        .main-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--gold-primary);
            padding: 30px 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-5px);
        }

        .menu-card h2 { color: var(--gold-primary); }

        .section-view {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .section-view.active { display: block; }

        .action-bar {
            display: none;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* تصميم المايكرو الأفقي الصغير */
        .macro-row {
            background: #111;
            border: 1px solid var(--border-color);
            border-right: 4px solid var(--gold-primary);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .macro-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            height: 42px;
            resize: none;
        }

        .btn-copy {
            height: 42px;
            padding: 0 15px;
            flex-shrink: 0;
        }

        /* العناوين الرئيسية للسياسات والتحكم */
        .section-group {
            background: #121212;
            border: 1px solid #333;
            border-top: 3px solid var(--gold-primary);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .section-header-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .main-title-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .sub-controls {
            display: none;
            gap: 8px;
            margin-bottom: 15px;
            background: #181818;
            padding: 8px;
            border-radius: 6px;
            flex-wrap: wrap;
        }

        /* العناصر الفرعية داخل العنوان الرئيسي */
        .item-box {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            position: relative;
        }

        .item-content {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            resize: vertical;
            font-size: 0.9rem;
        }

        /* حقل التحذير الأحمر الوهاج */
        .warning-box {
            background: rgba(255, 0, 0, 0.08);
            border: 1px solid var(--red-alert);
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.25);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            position: relative;
        }

        .warning-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .warning-title {
            color: var(--red-alert);
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 5px;
            text-shadow: 0 0 5px rgba(255, 42, 42, 0.6);
        }

        .warning-content {
            width: 100%;
            background: #120505;
            border: 1px solid var(--red-alert);
            color: #ff8888;
            padding: 8px;
            border-radius: 4px;
            resize: vertical;
            font-size: 0.9rem;
            text-shadow: 0 0 3px rgba(255, 0, 0, 0.5);
        }

        /* القائمة المطوية (Accordion) */
        .accordion-wrapper {
            margin-bottom: 10px;
            position: relative;
        }

        .acc-header-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .acc-header-input {
            flex: 1;
            background: #222;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 6px 6px 0 0;
            font-size: 0.95rem;
        }

        .accordion-btn {
            background-color: #1a1a1a;
            color: var(--gold-primary);
            cursor: pointer;
            padding: 10px 15px;
            width: 100%;
            border: 1px solid var(--border-color);
            text-align: right;
            outline: none;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 0 0 6px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel {
            padding: 0 10px;
            background-color: #141414;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 6px 6px;
        }

        .panel-content { padding: 10px 0; }

        .item-header-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
        }

        /* زر القلم العائم */
        .floating-edit-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.25);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .floating-edit-btn:hover {
            background: rgba(212, 175, 55, 0.8);
            color: #000;
            transform: scale(1.1);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            padding: 15px 0;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            width: 100%;
        }

        .footer-text { color: #888; font-size: 0.85rem; }
        .footer-author { color: var(--gold-primary); font-weight: 900; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #181818;
            border: 2px solid var(--gold-primary);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .modal-box input {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid var(--gold-primary);
            color: #fff;
            text-align: center;
            font-size: 1.2rem;
            border-radius: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="admin-banner" class="admin-banner">
            ⚙️ تم تفعيل وضع التعديل والتحكم (المسؤول)
        </div>

        <!-- الواجهة الرئيسية -->
        <div id="main-view">
            <header>
                <h1>فصيل شرطة هوميلاند</h1>
                <img src="https://via.placeholder.com/600x300/181818/d4af37?text=Homeland+Police+Faction" alt="شعار فصيل شرطة هوميلاند" class="faction-img">
            </header>

            <div class="main-menu">
                <div class="menu-card" onclick="openSection('macro-view')">
                    <h2>مايكرو الفصيل</h2>
                    <p style="color: #aaa; margin-top: 10px;">إدارة وحفظ الأوامر والنصوص السريعة للنسخ</p>
                </div>
                <div class="menu-card" onclick="openSection('policies-view')">
                    <h2>سياسات ونظام الترقية</h2>
                    <p style="color: #aaa; margin-top: 10px;">استعراض القوانين وشروط الترقيات الرتبية</p>
                </div>
            </div>
        </div>

        <!-- قسم المايكرو -->
        <div id="macro-view" class="section-view">
            <button class="btn btn-back" onclick="goHome()">➜ الرجوع للرئيسية</button>
            <h2 style="color: var(--gold-primary); margin-bottom: 15px;">قسم مايكرو الفصيل</h2>
            
            <div class="action-bar admin-only">
                <button class="btn" onclick="addMacroRow()">+ إضافة مايكرو جديد</button>
                <button class="btn btn-save" onclick="saveData()">💾 حفظ التعديلات</button>
            </div>

            <div id="macro-container">
                <!-- عناصر المايكرو -->
            </div>
        </div>

        <!-- قسم السياسات -->
        <div id="policies-view" class="section-view">
            <button class="btn btn-back" onclick="goHome()">➜ الرجوع للرئيسية</button>
            <h2 style="color: var(--gold-primary); margin-bottom: 15px;">سياسات ونظام الترقية</h2>
            
            <div class="action-bar admin-only">
                <button class="btn" onclick="addMainSection()">+ إضافة عنوان رئيسي جديد</button>
                <button class="btn btn-save" onclick="saveData()">💾 حفظ التعديلات</button>
            </div>

            <div id="policies-container">
                <!-- الأقسام والعناصر -->
            </div>
        </div>

        <!-- التوقيع -->
        <footer>
            <p class="footer-text">تم تطوير وإنشاء الموقع بواسطة: <span class="footer-author">ITS IRAQI</span></p>
        </footer>
    </div>

    <!-- زر التعديل -->
    <div class="floating-edit-btn" onclick="openLoginModal()" title="دخول المسؤول">✏️</div>

    <!-- نافذة الرمز -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:var(--gold-primary); margin-bottom:15px;">دخول المسؤول</h3>
            <input type="password" id="pin-input" placeholder="••••" maxlength="10">
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="btn" onclick="verifyPin()">دخول</button>
                <button class="btn btn-back" style="margin:0;" onclick="closeLoginModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_PIN = "1221";
        let isAdmin = false;

        window.onload = function() {
            loadData();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('pin') === SECRET_PIN) activateAdmin();
        };

        // حفظ البيانات
        function saveData() {
            document.querySelectorAll('textarea').forEach(ta => ta.textContent = ta.value);
            document.querySelectorAll('input').forEach(inp => inp.setAttribute('value', inp.value));

            localStorage.setItem('homeland_v3_macros', document.getElementById('macro-container').innerHTML);
            localStorage.setItem('homeland_v3_policies', document.getElementById('policies-container').innerHTML);

            alert("تم حفظ التعديلات بنجاح!");
        }

        // تحميل البيانات
        function loadData() {
            const savedMacros = localStorage.getItem('homeland_v3_macros');
            const savedPolicies = localStorage.getItem('homeland_v3_policies');

            if (savedMacros) {
                document.getElementById('macro-container').innerHTML = savedMacros;
            } else {
                document.getElementById('macro-container').innerHTML = `
                    <div class="macro-row">
                        <textarea class="macro-input editable-field" id="m-1" readonly>مركبة هوميلاند: يرجى التوقف جانباً وإطفاء المحرك للتفتيش الروتيني.</textarea>
                        <button class="btn btn-copy" onclick="copyText('m-1')">📋 نسخ النص</button>
                        <button class="btn-delete admin-only" onclick="deleteElement(this)">🗑️ حذف</button>
                    </div>
                `;
            }

            if (savedPolicies) {
                document.getElementById('policies-container').innerHTML = savedPolicies;
            } else {
                const defaultId = 'sec-' + Date.now();
                document.getElementById('policies-container').innerHTML = `
                    <div class="section-group" id="${defaultId}">
                        <div class="section-header-bar">
                            <input type="text" class="main-title-input editable-field" value="نظام الترقية من رتبة جندي إلى عريف" readonly>
                            <button class="btn-delete admin-only" onclick="deleteElement(this)">🗑️ حذف القسم</button>
                        </div>
                        <div class="sub-controls admin-only">
                            <button class="btn btn-sub" onclick="addSubItem('${defaultId}')">+ إضافة بند</button>
                            <button class="btn btn-sub" onclick="addAccordionItem('${defaultId}')">+ إضافة قائمة مطوية</button>
                            <button class="btn btn-sub btn-sub-warning" onclick="addWarningItem('${defaultId}')">⚠️ إضافة تحذير</button>
                        </div>
                        <div class="section-content-area">
                            <div class="item-box">
                                <div class="item-header-bar">
                                    <button class="btn-delete admin-only" onclick="deleteElement(this)">🗑️ حذف</button>
                                </div>
                                <textarea class="item-content editable-field" rows="3" readonly>1. الخدمة لمدة 3 أيام متواصلة.
2. الالتزام بالحضور بالمايكرو الرسمية.</textarea>
                            </div>
                            <div class="warning-box">
                                <div class="warning-header">
                                    <div class="warning-title">⚠️ تحذير هام</div>
                                    <button class="btn-delete admin-only" onclick="deleteElement(this)">🗑️ حذف</button>
                                </div>
                                <textarea class="warning-content editable-field" rows="2" readonly>يمنع الترفيع في حال وجود مخالفة انضباطية خلال الأسبوع.</textarea>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (isAdmin) activateAdmin();
        }

        // دالة الحذف للأدمن
        function deleteElement(btn) {
            if (confirm("هل أنت تأكد من رغبتك في حذف هذا العنصر؟")) {
                const targetBox = btn.closest('.macro-row, .section-group, .item-box, .warning-box, .accordion-wrapper');
                if (targetBox) {
                    targetBox.remove();
                }
            }
        }

        // إضافة مايكرو جديد
        let macroCount = Date.now();
        function addMacroRow() {
            const id = 'm-' + (macroCount++);
            const div = document.createElement('div');
            div.className = 'macro-row';
            div.innerHTML = `
                <textarea class="macro-input" id="${id}" placeholder="اكتب نص المايكرو هنا..."></textarea>
                <button class="btn btn-copy" onclick="copyText('${id}')">📋 نسخ النص</button>
                <button class="btn-delete admin-only" style="display:inline-flex;" onclick="deleteElement(this)">🗑️ حذف</button>
            `;
            document.getElementById('macro-container').appendChild(div);
        }

        // إضافة عنوان رئيسي
        function addMainSection() {
            const secId = 'sec-' + Date.now();
            const div = document.createElement('div');
            div.className = 'section-group';
            div.id = secId;
            div.innerHTML = `
                <div class="section-header-bar">
                    <input type="text" class="main-title-input" placeholder="اكتب العنوان الرئيسي هنا...">
                    <button class="btn-delete admin-only" style="display:inline-flex;" onclick="deleteElement(this)">🗑️ حذف القسم</button>
                </div>
                <div class="sub-controls admin-only" style="display:flex;">
                    <button class="btn btn-sub" onclick="addSubItem('${secId}')">+ إضافة بند</button>
                    <button class="btn btn-sub" onclick="addAccordionItem('${secId}')">+ إضافة قائمة مطوية</button>
                    <button class="btn btn-sub btn-sub-warning" onclick="addWarningItem('${secId}')">⚠️ إضافة تحذير</button>
                </div>
                <div class="section-content-area"></div>
            `;
            document.getElementById('policies-container').appendChild(div);
        }

        // إضافة بند
        function addSubItem(secId) {
            const container = document.getElementById(secId).querySelector('.section-content-area');
            const div = document.createElement('div');
            div.className = 'item-box';
            div.innerHTML = `
                <div class="item-header-bar">
                    <button class="btn-delete admin-only" style="display:inline-flex;" onclick="deleteElement(this)">🗑️ حذف</button>
                </div>
                <textarea class="item-content" rows="3" placeholder="اكتب تفاصيل البند..."></textarea>
            `;
            container.appendChild(div);
        }

        // إضافة حقل تحذير
        function addWarningItem(secId) {
            const container = document.getElementById(secId).querySelector('.section-content-area');
            const div = document.createElement('div');
            div.className = 'warning-box';
            div.innerHTML = `
                <div class="warning-header">
                    <div class="warning-title">⚠️ تحذير هـام</div>
                    <button class="btn-delete admin-only" style="display:inline-flex;" onclick="deleteElement(this)">🗑️ حذف</button>
                </div>
                <textarea class="warning-content" rows="2" placeholder="اكتب نص التحذير هنا..."></textarea>
            `;
            container.appendChild(div);
        }

        // إضافة قائمة مطوية
        function addAccordionItem(secId) {
            const container = document.getElementById(secId).querySelector('.section-content-area');
            const wrapper = document.createElement('div');
            wrapper.className = 'accordion-wrapper';
            
            wrapper.innerHTML = `
                <div class="acc-header-bar">
                    <input type="text" class="acc-header-input" value="عنوان القائمة المطوية (انقر للتعديل)">
                    <button class="btn-delete admin-only" style="display:inline-flex;" onclick="deleteElement(this)">🗑️ حذف</button>
                </div>
                <button class="accordion-btn" onclick="toggleAccordion(this)">
                    <span>عرض التفاصيل</span>
                    <span>▼</span>
                </button>
                <div class="panel">
                    <div class="panel-content">
                        <textarea class="item-content" rows="3" placeholder="المحتوى داخل القائمة المطوية..."></textarea>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
        }

        function toggleAccordion(btn) {
            const panel = btn.nextElementSibling;
            if (panel.style.maxHeight) {
                panel.style.maxHeight = null;
            } else {
                panel.style.maxHeight = panel.scrollHeight + "px";
            }
        }

        function copyText(id) {
            const textarea = document.getElementById(id);
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            alert("تم نسخ النص بنجاح!");
        }

        function openLoginModal() {
            if (isAdmin) return alert("وضع التعديل مفعّل بالفعل.");
            document.getElementById('login-modal').style.display = 'flex';
        }

        function closeLoginModal() {
            document.getElementById('login-modal').style.display = 'none';
        }

        function verifyPin() {
            if (document.getElementById('pin-input').value === SECRET_PIN) {
                activateAdmin();
                closeLoginModal();
            } else {
                alert("الرمز غير صحيح!");
            }
        }

        function activateAdmin() {
            isAdmin = true;
            document.getElementById('admin-banner').style.display = 'block';
            document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'flex');
            document.querySelectorAll('.btn-delete').forEach(e => e.style.display = 'inline-flex');
            document.querySelectorAll('.editable-field').forEach(e => e.removeAttribute('readonly'));
        }

        function openSection(id) {
            document.getElementById('main-view').style.display = 'none';
            document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goHome() {
            document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
            document.getElementById('main-view').style.display = 'block';
        }
    </script>
</body>
</html>
