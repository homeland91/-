<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة البيانات - Firebase</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --accent-color: #d4af37; /* ذهبي ملكي */
      --text-color: #ffffff;
      --text-muted: #a0a0a0;
      --border-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
    }

    h2 {
      color: var(--accent-color);
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #0f0f0f;
      color: var(--text-color);
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #f1c40f;
    }

    #statusMessage {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>إضافة بيان جديد</h2>
    <form id="addForm">
      <div class="form-group">
        <label for="name">الاسم / المعرف:</label>
        <input type="text" id="name" placeholder="أدخل الاسم هنا..." required>
      </div>

      <div class="form-group">
        <label for="role">الرتبة / التفاصيل:</label>
        <input type="text" id="role" placeholder="أدخل الرتبة أو الملاحظة..." required>
      </div>

      <button type="submit" id="submitBtn">حفظ في قاعدة البيانات</button>
    </form>
    
    <div id="statusMessage"></div>
  </div>

  <!-- Firebase JavaScript Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyBe32dQWOQIgY4Zy--0Y7FLTkeeLUJVzY8",
      authDomain: "homeland-2a063.firebaseapp.com",
      projectId: "homeland-2a063",
      storageBucket: "homeland-2a063.firebasestorage.app",
      messagingSenderId: "20874622705",
      appId: "1:20874622705:web:de1dcf21c40c10b7e61b50",
      measurementId: "G-5B0B3YSXSX"
    };

    // تهيئة التطبيق وقاعدة البيانات
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // التعامل مع نموذج الإضافة
    const form = document.getElementById("addForm");
    const statusMessage = document.getElementById("statusMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nameVal = document.getElementById("name").value;
      const roleVal = document.getElementById("role").value;

      statusMessage.style.color = "#d4af37";
      statusMessage.textContent = "جاري إرسال البيانات...";

      try {
        // إضافة البيانات إلى مجموعة (Collection) اسمها records
        await addDoc(collection(db, "records"), {
          name: nameVal,
          role: roleVal,
          createdAt: new Date().toISOString()
        });

        statusMessage.style.color = "#2ecc71";
        statusMessage.textContent = "تمت الإضافة بنجاح!";
        form.reset();
      } catch (error) {
        console.error("Error adding document: ", error);
        statusMessage.style.color = "#e74c3c";
        statusMessage.textContent = "حدث خطأ أثناء الإضافة: " + error.message;
      }
    });
  </script>

</body>
</html>
